name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow one concurrent deployment; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Production: custom domain at the root. public/CNAME pins the domain
          # on GitHub's side; these must agree with it or canonical URLs,
          # hreflang and the sitemap all point at the wrong host.
          SITE_URL: https://tactaxes.com
          BASE_PATH: /

      - name: Verify CNAME survived the build
        # Astro wipes dist/ on every build. If public/CNAME ever goes missing,
        # Pages silently drops the custom domain and reverts to *.github.io —
        # a failure that looks like a DNS problem and wastes hours.
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing — custom domain would be dropped"; exit 1; }
          echo "CNAME -> $(cat dist/CNAME)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
